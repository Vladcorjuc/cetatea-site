<div
  class="donate-fab"
  routerLinkActive="is-current"
  [class.donate-fab--open]="deschis()"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  <button
    type="button"
    class="donate-fab__icon"
    (click)="comuta($event)"
    [attr.aria-expanded]="deschis()"
    [attr.aria-label]="i18n.t('nav.doneaza')"
  >
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
      <path
        d="M12 21s-6.716-4.35-9.428-8.06C.86 10.42 1.2 6.9 3.9 5.2c2.16-1.36 4.86-.8 6.4 1.02l1.7 2.02 1.7-2.02c1.54-1.82 4.24-2.38 6.4-1.02 2.7 1.7 3.04 5.22 1.33 7.74C18.716 16.65 12 21 12 21Z"
      />
    </svg>
  </button>
  <a routerLink="/doneaza" class="donate-fab__label" (click)="inchide()">
    {{ i18n.t('nav.doneaza') }}
  </a>
</div>
