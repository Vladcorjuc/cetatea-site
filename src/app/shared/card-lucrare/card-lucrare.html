<article class="card-lucrare">
  <h3>{{ card().titlu }}</h3>
  <p>{{ card().text }}</p>
  @if (esteAncora) {
    <a href="#" (click)="scrolleaza($event)" class="card-lucrare__link">
      {{ card().linkText }}
      <span aria-hidden="true">→</span>
    </a>
  } @else {
    <a [routerLink]="card().linkRuta" class="card-lucrare__link">
      {{ card().linkText }}
      <span aria-hidden="true">→</span>
    </a>
  }
</article>
