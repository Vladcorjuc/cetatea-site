<header class="header">
  <div class="container header__bar">
    <a routerLink="/" class="header__brand" (click)="inchideMeniu()" aria-label="Biserica Penticostală Cetatea">
      <svg class="header__mark" viewBox="112 52 273 301" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M353.701 62C365.37 62.0001 374.829 71.4595 374.829 83.1279V279.617H367.787V273.983C367.787 273.595 367.472 273.278 367.083 273.278H362.153V264.827C362.153 264.439 361.838 264.123 361.449 264.123H355.342C354.292 261.747 353.471 259.166 352.998 256.381V230.773C352.998 230.706 353.008 230.638 353.027 230.573L355.786 221.261C355.805 221.196 355.815 221.129 355.815 221.062V209.19C355.815 208.802 355.499 208.486 355.11 208.486H349.477C349.088 208.486 348.773 208.802 348.772 209.19V213.416H343.843V209.19C343.842 208.802 343.527 208.487 343.139 208.486H337.504C337.115 208.487 336.8 208.802 336.8 209.19V213.416H331.87V209.19C331.87 208.802 331.555 208.487 331.166 208.486H325.531C325.143 208.487 324.827 208.802 324.827 209.19V213.416H319.897V209.19C319.897 208.802 319.582 208.486 319.193 208.486H313.56C313.171 208.486 312.855 208.802 312.854 209.19V221.062C312.855 221.129 312.865 221.196 312.884 221.261L314.315 226.093H290.142V192.992H307.043C307.736 192.992 308.012 192.095 307.438 191.705L291.836 181.109C291.764 181.061 291.701 180.998 291.651 180.927L248.994 119.18C248.714 118.775 248.115 118.774 247.835 119.18L205.178 180.927C205.128 180.998 205.066 181.061 204.994 181.109L189.391 191.705C188.817 192.095 189.094 192.992 189.787 192.992H205.631V231.099C204.994 235.748 202.981 241.323 197.355 244.403C186.516 250.338 175.91 255.448 165.77 260.758V269.757H152.812C152.423 269.757 152.108 270.072 152.107 270.461V278.912H142.247C141.858 278.912 141.543 279.228 141.543 279.616V290.18H135.909C135.52 290.18 135.205 290.496 135.205 290.885V297.927H129.571C129.36 297.927 129.172 298.022 129.043 298.169V343H122V83.1279C122 71.4595 131.46 62.0001 143.128 62H353.701ZM250 200.529H258V204.294H250V225H246V204.294H238V200.529H246V193H250V200.529Z" />
        <path d="M272.711 341.591V303.561C272.711 289.948 261.675 278.912 248.062 278.912C234.449 278.912 223.413 289.948 223.413 303.561V341.591C223.413 342.369 224.044 343 224.822 343H271.303C272.081 343 272.711 342.369 272.711 341.591Z" />
      </svg>
      <span class="header__wordmark">
        <small>Biserica Penticostală</small>
        <strong>Cetatea</strong>
      </span>
    </a>

    <nav class="header__nav" [class.header__nav--open]="meniuDeschis()">
      <ul>
        @for (link of linkuri; track link.ruta) {
          <li>
            <a
              [routerLink]="link.ruta"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: link.exact }"
              (click)="inchideMeniu()"
            >
              {{ i18n.t(link.cheie) }}
            </a>
          </li>
        }
      </ul>
    </nav>

    <div class="header__actions">
      <button
        type="button"
        class="header__icon-btn header__lang"
        (click)="i18n.toggle()"
        [attr.aria-label]="i18n.t('header.language')"
      >
        {{ i18n.lang() === 'ro' ? 'EN' : 'RO' }}
      </button>

      <button
        type="button"
        class="header__icon-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="i18n.t('header.theme')"
      >
        @if (theme.mode() === 'dark') {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
        }
      </button>

      <button
        type="button"
        class="header__toggle"
        (click)="toggleMeniu()"
        [attr.aria-expanded]="meniuDeschis()"
        [attr.aria-label]="i18n.t('header.menu')"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>
</header>
